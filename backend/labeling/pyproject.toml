[project]
name = "stock-mood-labeling"
version = "0.1.0"
description = "Reproducible Reddit sentiment weak-labeling pilot"
requires-python = ">=3.11,<3.13"
dependencies = [
  "laya==0.3.20",
  "praw==8.0.3",
  "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
  "mypy==1.20.2",
  "pytest==8.4.2",
  "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
strict = true
